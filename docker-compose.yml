services:

  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_referral

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: hospital-backend
    restart: always

    depends_on:
      - mysql

    env_file:
      - ./backend/.env

    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: hospital-frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "3000:3000"

volumes:
  mysql_data:
